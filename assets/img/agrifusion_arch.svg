<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 145" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0969da"/>
    </marker>
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Node 1: Sensors -->
  <g transform="translate(10, 15)" filter="url(#subtle-shadow)">
    <rect width="130" height="110" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
    <rect width="130" height="24" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
    <rect y="16" width="130" height="8" fill="#f6f8fa"/>
    <text x="65" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Field Sensors</text>
    <text x="65" y="48" text-anchor="middle" font-size="10" font-weight="600" fill="#24292f">SHT30</text>
    <text x="65" y="62" text-anchor="middle" font-size="9" fill="#57606a">Air Temp &amp; Humidity</text>
    <text x="65" y="84" text-anchor="middle" font-size="10" font-weight="600" fill="#24292f">Soil 7-in-1</text>
    <text x="65" y="98" text-anchor="middle" font-size="9" fill="#57606a">Moisture, EC, pH, NPK</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 140 70 L 165 70" stroke="#0969da" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="152" y="62" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0969da">RS485 / I2C</text>

  <!-- Node 2: Edge Node -->
  <g transform="translate(165, 15)" filter="url(#subtle-shadow)">
    <rect width="125" height="110" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.4"/>
    <rect width="125" height="24" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/>
    <rect y="16" width="125" height="8" fill="#ddf4ff"/>
    <text x="62.5" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#0550ae">ESP32-S3 Node</text>
    <text x="62.5" y="46" text-anchor="middle" font-size="9.5" font-weight="600" fill="#24292f">Firmware Controller</text>
    <text x="62.5" y="62" text-anchor="middle" font-size="8.5" fill="#57606a">• Modbus polling</text>
    <text x="62.5" y="77" text-anchor="middle" font-size="8.5" fill="#57606a">• CRC verification</text>
    <text x="62.5" y="92" text-anchor="middle" font-size="8.5" fill="#57606a">• Telemetry pack &amp; retry</text>
    <text x="62.5" y="107" text-anchor="middle" font-size="8.5" fill="#57606a">• Transmission logs</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 290 70 L 315 70" stroke="#0969da" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="302" y="62" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0969da">UART / AT</text>

  <!-- Node 3: Cellular -->
  <g transform="translate(315, 15)" filter="url(#subtle-shadow)">
    <rect width="115" height="110" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
    <rect width="115" height="24" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
    <rect y="16" width="115" height="8" fill="#f6f8fa"/>
    <text x="57.5" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Cellular Uplink</text>
    <text x="57.5" y="46" text-anchor="middle" font-size="9.5" font-weight="600" fill="#24292f">SIM A7682S</text>
    <text x="57.5" y="62" text-anchor="middle" font-size="8.5" fill="#57606a">• 4G LTE connectivity</text>
    <text x="57.5" y="77" text-anchor="middle" font-size="8.5" fill="#57606a">• Outdoor field telemetry</text>
    <text x="57.5" y="92" text-anchor="middle" font-size="8.5" fill="#57606a">• HTTPS / REST push</text>
    <text x="57.5" y="107" text-anchor="middle" font-size="8.5" fill="#57606a">• Signal quality logs</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 430 70 L 455 70" stroke="#0969da" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="442" y="62" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0969da">HTTPS</text>

  <!-- Node 4: Cloud Storage -->
  <g transform="translate(455, 15)" filter="url(#subtle-shadow)">
    <rect width="135" height="110" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
    <rect width="135" height="24" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
    <rect y="16" width="135" height="8" fill="#f6f8fa"/>
    <text x="67.5" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Firebase RTDB</text>
    <text x="67.5" y="46" text-anchor="middle" font-size="9.5" font-weight="600" fill="#24292f">Layer0: Raw Records</text>
    <text x="67.5" y="60" text-anchor="middle" font-size="8.5" fill="#57606a">Payloads &amp; timestamps</text>
    <text x="67.5" y="80" text-anchor="middle" font-size="9.5" font-weight="600" fill="#24292f">Layer1: Canonicalized</text>
    <text x="67.5" y="94" text-anchor="middle" font-size="8.5" fill="#57606a">Sensor snapshots</text>
    <text x="67.5" y="107" text-anchor="middle" font-size="8.5" fill="#57606a">Provenance metadata</text>
  </g>

  <!-- Arrow 4 -->
  <path d="M 590 70 L 615 70" stroke="#0969da" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="602" y="62" text-anchor="middle" font-size="7.5" font-weight="600" fill="#0969da">Trace</text>

  <!-- Node 5: Pipeline & ML -->
  <g transform="translate(615, 15)" filter="url(#subtle-shadow)">
    <rect width="135" height="110" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.2"/>
    <rect width="135" height="24" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
    <rect y="16" width="135" height="8" fill="#ddf4ff"/>
    <text x="67.5" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#0550ae">Data &amp; ML Pipeline</text>
    <text x="67.5" y="46" text-anchor="middle" font-size="9" font-weight="600" fill="#24292f">Temporal Cleaning</text>
    <text x="67.5" y="60" text-anchor="middle" font-size="8.5" fill="#57606a">• Gap purging</text>
    <text x="67.5" y="74" text-anchor="middle" font-size="8.5" fill="#57606a">• Weak label generation</text>
    <text x="67.5" y="88" text-anchor="middle" font-size="8.5" fill="#57606a">• Temporal split views</text>
    <text x="67.5" y="103" text-anchor="middle" font-size="8.5" font-weight="600" fill="#0969da">Tabular Benchmarks</text>
  </g>
</svg>
