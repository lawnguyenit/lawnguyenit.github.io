note_vi: 'Tri thức, dự án và quyết định lưu trong vault Obsidian quản lý bằng Git. Một file AGENTS.md duy nhất là nguồn quy tắc cho Claude, Codex và Gemini (CLAUDE.md và GEMINI.md chỉ trỏ về), nên sửa một nơi thì cả ba áp dụng. Kiểm soát: agent phải ghi rõ đã đọc note nào ở đầu câu trả lời; điều chưa biết ghi là "chưa biết" thay vì suy đoán, suy luận phải nêu nguồn; không ghi khóa, token vào vault, gặp file .env thì dừng chờ đồng ý.'
