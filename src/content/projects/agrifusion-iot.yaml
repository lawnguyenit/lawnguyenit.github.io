tagline_en: 'Graduation project: durian-orchard IoT system and weak-label ML benchmark'
tagline_vi: 'Đồ án tốt nghiệp: hệ IoT giám sát vườn sầu riêng và pipeline benchmark ML'
summary_en: 'An end-to-end cellular telemetry system for a durian orchard (ESP32-S3, SHT30, an ES-SOIL-7-IN-1 Modbus/RS485 soil sensor, SIM A7682S 4G LTE, Firebase Realtime Database). Each record is structured as traceable telemetry: measurements, transmission status, retry metadata and temporal provenance. A downstream pipeline turns raw records into structured benchmark views with temporal features.'
summary_vi: Hệ thu thập dữ liệu ngoài trời cho vườn sầu riêng (ESP32-S3, 4G, RS485/Modbus, Firebase) và pipeline biến dữ liệu thô thành tập benchmark ML có truy vết. Mỗi bản ghi có trạng thái truyền, số lần thử lại và nguồn thời gian. Dự án tốt nghiệp, đồng thời là nền cho bài báo nghiên cứu.
contribution_en: 'Designed requirements and architecture, directed AI coding agents (Claude, Codex) to write and test the code, and validated the results. Field hardware: designed and deployed.'
contribution_vi: Thiết kế yêu cầu và kiến trúc, điều phối agent AI (Claude, Codex) viết mã, kiểm thử và kiểm định kết quả.
highlights_en:
- 'Designed and deployed the field device (ESP32-S3, RS485/Modbus, 4G LTE, Firebase RTDB); each record carries transmission status, retry count and time source.'
- 'Two-layer data pipeline with manifest and hash checks (202-file reproducibility bundle); benchmarked XGBoost, TabPFN, FT-Transformer and TabM under temporal vs. random splits on weak labels.'
highlights_vi:
- 'Thiết kế và triển khai thiết bị ngoài vườn (ESP32-S3, RS485/Modbus, 4G LTE, Firebase RTDB); mỗi bản ghi có trạng thái truyền, số lần thử lại, nguồn thời gian.'
- 'Pipeline dữ liệu 2 lớp có manifest và kiểm tra hash (bộ tái lập 202 file); so sánh XGBoost, TabPFN, FT-Transformer, TabM theo temporal split và random split trên nhãn yếu.'
