internal_note: 'Giới hạn: không phải bằng chứng độc lập về stress cây trồng (nhãn là nhãn yếu); dashboard ở chế độ demo; chưa có chứng nhận triển khai; WADE V9 riêng tư, không nhắc. Cần chủ site xác nhận mô tả đóng góp từng phần. Bài EAI: chỉ viết ''nộp, đang phản biện''; không viết accepted. Bài SNCS: ''đã nộp, đang xử lý'' (Editor Assigned 24/11/2026). Câu ''thiết bị do mình thiết kế và triển khai'' theo Showcase-Claims (phần thiết bị giữ ''designed and deployed''); phần phần mềm/pipeline do agent AI viết, đã gỡ thẻ ''Phát triển cùng Claude/Codex'' khỏi CV. Tên tiếng Việt của đồ án là bản dịch từ tên tiếng Anh, chờ chủ site xác nhận tên tiếng Việt chính thức. Thẻ bài báo đã gỡ (mục Công bố đã đủ). Ngày bắt đầu 09/2025: chờ xác nhận (có thể là 10/2025). Hồ sơ đi làm không hiện GVHD cho gọn (dữ liệu advisor vẫn giữ).'
