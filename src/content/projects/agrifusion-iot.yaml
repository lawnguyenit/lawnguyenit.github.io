# Ngày bắt đầu: chủ site chưa chắc 09 hay 10/2025; đang dùng 2025-09, chờ xác nhận.
start: 2025-09
end: 2026-05
tags: []
tagline_en: 'Graduation thesis: Building an IoT-based System for Monitoring Environmental and Nutritional Conditions in Durian Orchards'
tagline_vi: 'Đồ án tốt nghiệp: Xây dựng hệ thống IoT giám sát điều kiện môi trường và dinh dưỡng trong vườn sầu riêng'
summary_en: 'An end-to-end cellular telemetry system for a durian orchard (ESP32-S3, SHT30, an ES-SOIL-7-IN-1 Modbus/RS485 soil sensor, SIM A7682S 4G LTE, Firebase Realtime Database). Each record is structured as traceable telemetry: measurements, transmission status, retry metadata and temporal provenance. A downstream pipeline turns raw records into structured benchmark views with temporal features.'
summary_vi: Hệ thu thập dữ liệu ngoài trời cho vườn sầu riêng (ESP32-S3, 4G, RS485/Modbus, Firebase) và pipeline biến dữ liệu thô thành tập benchmark ML có truy vết. Mỗi bản ghi có trạng thái truyền, số lần thử lại và nguồn thời gian. Dự án tốt nghiệp, đồng thời là nền cho bài báo nghiên cứu.
contribution_en: 'Designed requirements and architecture, directed AI coding agents (Claude, Codex) to write and test the code, and validated the results. Field hardware: designed and deployed.'
contribution_vi: Thiết kế yêu cầu và kiến trúc, điều phối agent AI (Claude, Codex) viết mã, kiểm thử và kiểm định kết quả.
highlights_en:
- '**Device:** designed and deployed a field measuring device (ESP32-S3, RS485/Modbus sensors) that sends data over 4G.'
- '**Data:** uploaded the data to the cloud (Firebase), pulled it back, then cleaned and standardized it into an analysis dataset.'
- '**Models:** trained and compared machine-learning models (XGBoost, TabPFN, deep-learning models) over time; validated the results and wrote 2 papers (see Publications).'
highlights_vi:
- '**Thiết bị:** thiết kế và triển khai thiết bị đo ngoài vườn (ESP32-S3, cảm biến RS485/Modbus), gửi dữ liệu qua 4G.'
- '**Dữ liệu:** đưa dữ liệu lên cloud (Firebase), kéo về, làm sạch và chuẩn hóa thành bộ dữ liệu phân tích.'
- '**Mô hình:** huấn luyện và so sánh các mô hình học máy (XGBoost, TabPFN, mô hình học sâu) theo thời gian; kiểm định kết quả và viết 2 bài báo (mục Công bố).'
