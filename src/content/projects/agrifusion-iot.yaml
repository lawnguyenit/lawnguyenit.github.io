internal_note: 'Giới hạn: không phải bằng chứng độc lập về stress cây trồng (nhãn là nhãn yếu); dashboard ở chế độ demo; chưa có chứng nhận triển khai; WADE V9 riêng tư, không nhắc. Cần chủ site xác nhận mô tả đóng góp từng phần. Bài EAI: chỉ viết ''nộp, đang phản biện''; không viết accepted. Câu ''thiết bị do mình thiết kế và triển khai'' theo Showcase-Claims (phần thiết bị giữ ''designed and deployed''); phần phần mềm/pipeline do agent AI viết.'
