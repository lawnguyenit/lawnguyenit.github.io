title: Workflow_Automation_Tool
tagline_en: 'Practice project: library of reusable workflow module contracts (n8n as the main target)'
tagline_vi: Thư viện hợp đồng module workflow dùng lại được (n8n là mục tiêu chính)
summary_en: 'A repository of reusable workflow module contracts, with concrete implementations added per job; n8n is the main target. Includes an API (Python, uvicorn, PostgreSQL via Docker Compose), four run modes (DRY_RUN, REPLAY, MOCK, REAL) and two reference systems: an intelligent document intake pipeline and a lead-management flow. Portfolio work, not a client deployment.'
summary_vi: 'Thư viện hợp đồng module workflow dùng lại được, thêm triển khai cụ thể khi có việc; n8n là mục tiêu chính. Có API (Python, uvicorn, PostgreSQL qua Docker Compose), bốn chế độ chạy (DRY_RUN, REPLAY, MOCK, REAL) và hai hệ thống tham chiếu: nhận tài liệu thông minh và quản lý lead. Là dự án portfolio, không phải triển khai cho khách.'
contribution_en: Designed requirements and architecture, directed AI coding agents (Claude, Codex) to write and test the code, and validated the results.
contribution_vi: Thiết kế yêu cầu và kiến trúc, điều phối agent AI (Claude, Codex) viết mã, kiểm thử và kiểm định kết quả.
highlights_en:
- 'Run modes separate previewing and replaying from real side effects: DRY_RUN and REPLAY write nothing, MOCK writes to the database without contacting any provider, REAL is only for configured, authorized setups.'
- Lead-management reference handles duplicate events with PostgreSQL idempotency and routes incomplete records to manual review; exercised by hand in MOCK mode with synthetic payloads (first write, duplicate, changed-payload conflict, missing field, response redaction).
- Two releases (0.1.0, 0.2.0). Provider connections (Gmail, OpenAI, Slack) are not verified against real credentials.
highlights_vi:
- Bốn chế độ chạy (DRY_RUN, REPLAY, MOCK, REAL) tách xem trước và phát lại khỏi tác động thật; REAL chỉ dùng khi đã cấu hình và được phép.
- Hệ quản lý lead chống trùng sự kiện (idempotency trên PostgreSQL), chuyển bản ghi thiếu thông tin sang duyệt tay; mới chạy thử thủ công ở chế độ MOCK với dữ liệu giả lập.
- Hai bản phát hành (0.1.0, 0.2.0); kết nối Gmail, OpenAI, Slack chưa kiểm chứng với thông tin đăng nhập thật.
