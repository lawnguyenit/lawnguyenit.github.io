title: layered-rag-harness
tagline_en: 'Practice project (in progress): document Q&A with access control, built one layer at a time'
tagline_vi: Hỏi đáp tài liệu (RAG) có kiểm soát quyền truy cập, xây từng lớp; đang hoàn thiện
summary_en: 'A learning and portfolio project: a retrieval-augmented document Q&A assistant with access control and tool calling, built one layer at a time. After each layer the same fixed question set is re-run to show which failure that layer fixes. Components (model provider, search backend, orchestrator, MCP transport) sit behind adapters that must pass the same contract tests, including cases where the user lacks permission. Still in progress.'
summary_vi: 'Dự án học tập và portfolio: trợ lý hỏi đáp tài liệu (RAG) có kiểm soát quyền truy cập và gọi công cụ, xây từng lớp một. Sau mỗi lớp chạy lại cùng một bộ câu hỏi cố định để thấy lớp đó sửa được lỗi nào. Các thành phần (nhà cung cấp model, công cụ tìm kiếm, bộ điều phối, MCP transport) nằm sau adapter và phải qua cùng bộ contract test, kể cả trường hợp người dùng không có quyền. Đang hoàn thiện.'
contribution_en: Designed requirements and architecture, directed AI coding agents (Claude, Codex) to write and test the code, and validated the results.
contribution_vi: Thiết kế yêu cầu và kiến trúc, điều phối agent AI (Claude, Codex) viết mã, kiểm thử và kiểm định kết quả.
highlights_en:
- Synthetic business system (orders, tickets, invoices, permissioned search) and web UI for testing; the sample user can read her own order but not another customer's.
- Runtime API with OIDC authentication (Keycloak) and a route catalog that turns intents into route plans; runtime tiers 1-2 have code and contract tests.
- 'Reports only measured numbers with their conditions. Status: retrieval and answer generation are not implemented yet and no baseline score is published; the demo is local-only.'
highlights_vi:
- 'Hệ nghiệp vụ giả lập có tìm kiếm theo quyền: người dùng mẫu đọc được đơn của mình, không đọc được đơn khách khác.'
- API runtime có xác thực OIDC (Keycloak) và danh mục route; hai tầng đầu đã có mã và contract test.
- Chỉ báo số đo thật; chưa làm truy xuất và sinh câu trả lời, chưa có điểm baseline, demo chỉ chạy cục bộ.
