internal_note: 'Ẩn khỏi cả hai hồ sơ: bật lại khi hoàn thiện phần truy xuất và trả lời RAG. Nguồn: README công khai đọc 2026-11-27 (chưa đọc code). README ghi một phần mã viết có AI hỗ trợ. Chưa kiểm Keycloak thật, chưa có điểm đo LLM; nút ''ask via harness'' chưa nối. Không nói: có RAG chạy được, có kết quả đo, dùng được ở production. "Tài liệu nội bộ" = kho tài liệu giả lập của một công ty hư cấu (data/corpus). Ngày bắt đầu chưa biết. Hiện ở cả academic (liên quan AI security/kiểm soát truy cập): chủ site có thể gỡ ''academic''.'
