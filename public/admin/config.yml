# Sveltia CMS 5.0.1 · repo lawnguyenit/lawnguyenit.github.io · nhánh main
# FILE NÀY ĐƯỢC SINH TỰ ĐỘNG bởi admin-tools/gen-config.py. Sửa bằng script rồi sinh lại.
# Tên trường (name) trùng với src/content.config.ts; kiểm tra bằng: node admin-tools/validate-config.mjs
$schema: https://unpkg.com/@sveltia/cms@5.0.1/schema/sveltia-cms.json
backend:
  name: github
  repo: lawnguyenit/lawnguyenit.github.io
  branch: main
  auth_methods:
  - token
  commit_messages:
    create: 'CMS: thêm {{collection}} "{{slug}}"'
    update: 'CMS: sửa {{collection}} "{{slug}}"'
    delete: 'CMS: xóa {{collection}} "{{slug}}"'
    uploadMedia: 'CMS: tải lên {{path}}'
    deleteMedia: 'CMS: xóa {{path}}'
site_url: https://cv.lnit.id.vn
display_url: https://cv.lnit.id.vn
app_title: Quản trị CV
media_folder: public/assets/img
public_folder: /assets/img
output:
  omit_empty_optional_fields: true
collections:
- name: profile
  label: Hồ sơ chung
  label_singular: hồ sơ
  description: 'Một file duy nhất: tên, liên hệ, ảnh, giới thiệu.'
  files:
  - name: profile
    label: Hồ sơ chung
    file: src/content/profile/profile.yaml
    format: yaml
    fields:
    - name: id
      label: Mã định danh
      widget: string
      hint: Luôn là "profile". Đừng sửa.
      required: true
      default: profile
      readonly: true
    - name: name
      label: Tên (không dấu)
      widget: string
      hint: 'Ví dụ: Lam-Nguyen Nguyen'
      required: true
    - name: name_native
      label: Tên tiếng Việt có dấu
      widget: string
      required: true
    - name: email
      label: Email
      widget: string
      hint: Hiện trên web.
      required: true
      type: email
    - name: github_handle
      label: Tên tài khoản GitHub
      widget: string
      hint: 'Ví dụ: lawnguyenit'
      required: true
    - name: github_url
      label: Địa chỉ trang GitHub
      widget: string
      hint: 'Ví dụ: https://github.com/lawnguyenit'
      required: true
      type: url
    - name: phone
      label: Số điện thoại
      widget: object
      hint: 'Số điện thoại: chỉ hiện khi bật "Hiện số" và đã điền số thật.'
      required: true
      fields:
      - name: value
        label: Số điện thoại
        widget: string
        hint: 'Còn giá trị giữ chỗ (chữ in hoa nối bằng dấu gạch dưới) nghĩa là chưa điền: số chưa hiện ở đâu cả. Điền số thật vào đây.'
        required: true
      - name: public
        label: Hiện số trên web và PDF
        widget: boolean
        hint: Bật = hiện số trên web và PDF (khi đã điền số thật). Tắt = ẩn số. Đây là quyết định của chủ site.
        required: false
        default: true
    - name: location_en
      label: Nơi ở (tiếng Anh)
      widget: string
      hint: 'Ví dụ: Vinh Long, Vietnam'
      required: true
    - name: location_vi
      label: Nơi ở (tiếng Việt)
      widget: string
      hint: 'Ví dụ: Vĩnh Long'
      required: true
    - name: photo
      label: Ảnh đại diện
      widget: image
      hint: Chọn ảnh có sẵn hoặc tải ảnh mới lên. Ảnh lưu ở public/assets/img.
      required: true
    - name: headline_en
      label: Chức danh mục tiêu (dòng dưới tên) (tiếng Anh)
      widget: string
      hint: 'Một dòng ngắn, ví dụ: Master''s student in IT · Applied ML for IoT. Đổi theo từng job.'
      required: true
    - name: headline_vi
      label: Chức danh mục tiêu (dòng dưới tên) (tiếng Việt)
      widget: string
      hint: 'Một dòng ngắn, ví dụ: Phân tích dữ liệu & Ứng dụng AI. Đổi theo từng job.'
      required: true
    - name: affiliation_en
      label: Nơi học / đơn vị (tiếng Anh)
      widget: string
      hint: Hiện ở hồ sơ học thuật. Bắt buộc nếu mục hiện ở hồ sơ học thuật.
      required: true
    - name: affiliation_vi
      label: Nơi học / đơn vị (tiếng Việt)
      widget: string
      hint: Hiện ở hồ sơ đi làm. Bắt buộc nếu mục hiện ở hồ sơ đi làm.
      required: true
    - name: summary_en
      label: Giới thiệu ngắn (tiếng Anh)
      widget: text
      hint: Đoạn giới thiệu của hồ sơ học thuật.
      required: true
    - name: summary_vi
      label: Giới thiệu ngắn (tiếng Việt)
      widget: text
      hint: Đoạn giới thiệu của hồ sơ đi làm.
      required: true
    - name: about_en
      label: Giới thiệu dài (tiếng Anh, Markdown)
      widget: markdown
      hint: Chỉ hồ sơ học thuật. Có thể dùng Markdown (in đậm, liên kết, đoạn).
      required: true
    - name: research_interests_en
      label: Hướng nghiên cứu (tiếng Anh)
      widget: list
      hint: Mỗi dòng một hướng. Chỉ hồ sơ học thuật.
      required: true
    - name: research_statement_en
      label: Tuyên bố nghiên cứu (tiếng Anh)
      widget: text
      hint: Chỉ hồ sơ học thuật.
      required: true
    - name: native_language_en
      label: Tiếng mẹ đẻ (tiếng Anh)
      widget: string
      hint: 'Ví dụ: Vietnamese (native)'
      required: true
    - name: native_language_vi
      label: Tiếng mẹ đẻ (tiếng Việt)
      widget: string
      hint: 'Ví dụ: Tiếng Việt (bản ngữ)'
      required: true
    - name: cv_pdf
      label: File CV dạng PDF
      widget: object
      hint: Đường dẫn PDF cho từng hồ sơ (PDF được sinh tự động khi build).
      required: true
      fields:
      - name: academic
        label: PDF hồ sơ học thuật
        widget: string
        hint: 'Đường dẫn file PDF sinh tự động: /pdf/academic-cv.pdf. Nút "Tải PDF" trên web dùng đường dẫn này.'
        required: false
      - name: job
        label: PDF hồ sơ đi làm
        widget: string
        hint: 'Đường dẫn file PDF sinh tự động: /pdf/ho-so-di-lam.pdf. Nút "Tải PDF" trên web dùng đường dẫn này.'
        required: false
    - name: updated
      label: Cập nhật lần cuối
      widget: string
      hint: Viết 2026 hoặc 2026-11
      required: true
      pattern:
      - ^\d{4}(-\d{2})?$
      - Viết 2025 hoặc 2025-11
- name: skill_groups
  label: Nhóm kỹ năng
  label_singular: nhóm kỹ năng
  folder: src/content/skill-groups
  extension: yaml
  format: yaml
  identifier_field: id
  slug: '{{id}}'
  create: true
  delete: true
  summary: '{{id}} · {{title_vi}}{{title_en}}'
  description: Nhóm acad-* cho hồ sơ học thuật, job-* cho hồ sơ đi làm. Thêm nhóm mới = thêm 1 mục.
  fields:
  - name: id
    label: Mã định danh (id)
    widget: string
    hint: Chữ thường không dấu, số, dấu gạch ngang. Trùng tên file. Đặt xong thì ĐỪNG đổi.
    required: true
    pattern:
    - ^[a-z0-9]+(-[a-z0-9]+)*$
    - 'Chỉ gồm chữ thường không dấu, số, dấu gạch ngang (ví dụ: python-co-ban)'
  - name: visible
    label: Hiện ở hồ sơ nào
    widget: select
    hint: Chọn một hoặc cả hai. ĐỂ TRỐNG = ẨN HOÀN TOÀN khỏi web.
    required: false
    options:
    - label: Hồ sơ học thuật (tiếng Anh)
      value: academic
    - label: Hồ sơ đi làm (tiếng Việt)
      value: job
    multiple: true
  - name: order
    label: Thứ tự
    widget: number
    hint: Số nhỏ hiện trước.
    required: true
    value_type: int
  - name: title_en
    label: Tên nhóm (tiếng Anh)
    widget: string
    hint: Hiện ở hồ sơ học thuật. Bắt buộc nếu mục hiện ở hồ sơ học thuật.
    required: false
  - name: title_vi
    label: Tên nhóm (tiếng Việt)
    widget: string
    hint: Hiện ở hồ sơ đi làm. Bắt buộc nếu mục hiện ở hồ sơ đi làm.
    required: false
  - name: layout
    label: Cách hiện
    widget: select
    hint: Chọn "Danh sách lồng" thì kỹ năng có ghi chú "primary/chính" hiện ở dòng "Sử dụng chính", ghi chú "foundation/nền tảng" ở dòng "Nền tảng".
    required: false
    options:
    - label: 'Một dòng: Nhóm: a, b, c'
      value: inline
    - label: 'Danh sách lồng: "Sử dụng chính" và "Nền tảng"'
      value: tiered
    default: inline
- name: skills
  label: Kỹ năng
  label_singular: kỹ năng
  folder: src/content/skills
  extension: yaml
  format: yaml
  identifier_field: id
  slug: '{{id}}'
  create: true
  delete: true
  summary: '{{id}} · {{name_vi}}{{name_en}} [{{status}}]'
  description: 'Mỗi kỹ năng một mục. Thêm kỹ năng: bấm "Tạo kỹ năng" và điền tên, nhóm, trạng thái.'
  fields:
  - name: id
    label: Mã định danh (id)
    widget: string
    hint: Chữ thường không dấu, số, dấu gạch ngang. Trùng tên file. Đặt xong thì ĐỪNG đổi.
    required: true
    pattern:
    - ^[a-z0-9]+(-[a-z0-9]+)*$
    - 'Chỉ gồm chữ thường không dấu, số, dấu gạch ngang (ví dụ: python-co-ban)'
  - name: visible
    label: Hiện ở hồ sơ nào
    widget: select
    hint: Chọn một hoặc cả hai. ĐỂ TRỐNG = ẨN HOÀN TOÀN khỏi web.
    required: false
    options:
    - label: Hồ sơ học thuật (tiếng Anh)
      value: academic
    - label: Hồ sơ đi làm (tiếng Việt)
      value: job
    multiple: true
  - name: order
    label: Thứ tự
    widget: number
    hint: Số nhỏ hiện trước.
    required: true
    value_type: int
  - name: name_en
    label: Tên kỹ năng (tiếng Anh)
    widget: string
    hint: Hiện ở hồ sơ học thuật. Bắt buộc nếu mục hiện ở hồ sơ học thuật.
    required: false
  - name: name_vi
    label: Tên kỹ năng (tiếng Việt)
    widget: string
    hint: Hiện ở hồ sơ đi làm. Bắt buộc nếu mục hiện ở hồ sơ đi làm.
    required: false
  - name: group_academic
    label: Nhóm ở hồ sơ học thuật
    widget: relation
    hint: Bắt buộc nếu "Hiện ở hồ sơ nào" có học thuật. Chọn nhóm bắt đầu bằng acad-.
    required: false
    collection: skill_groups
    value_field: '{{slug}}'
    display_fields:
    - '{{id}} · {{title_en}}{{title_vi}}'
    search_fields:
    - id
    - title_vi
    - title_en
  - name: group_job
    label: Nhóm ở hồ sơ đi làm
    widget: relation
    hint: Bắt buộc nếu "Hiện ở hồ sơ nào" có đi làm. Chọn nhóm bắt đầu bằng job-.
    required: false
    collection: skill_groups
    value_field: '{{slug}}'
    display_fields:
    - '{{id}} · {{title_vi}}{{title_en}}'
    search_fields:
    - id
    - title_vi
    - title_en
  - name: order_academic
    label: Thứ tự trong nhóm (học thuật)
    widget: number
    hint: Số nhỏ hiện trước.
    required: false
    value_type: int
  - name: order_job
    label: Thứ tự trong nhóm (đi làm)
    widget: number
    hint: Số nhỏ hiện trước.
    required: false
    value_type: int
  - name: status
    label: Trạng thái xác nhận
    widget: select
    hint: CHỈ kỹ năng "Đã xác nhận" mới được hiện. Nếu chọn trạng thái khác thì "Hiện ở hồ sơ nào" PHẢI để trống.
    required: true
    options:
    - label: Đã xác nhận (được khoe)
      value: confirmed
    - label: Chờ bài test
      value: pending_test
    - label: Chưa có bằng chứng
      value: unverified
    default: confirmed
  - name: note_en
    label: Ghi chú ngắn (tiếng Anh)
    widget: string
    hint: Tùy chọn.
    required: false
  - name: note_vi
    label: Ghi chú ngắn (tiếng Việt)
    widget: string
    hint: 'Tùy chọn. Ví dụ: chờ xác nhận sau bài test.'
    required: false
- name: projects
  label: Dự án
  label_singular: dự án
  folder: src/content/projects
  extension: yaml
  format: yaml
  identifier_field: id
  slug: '{{id}}'
  create: true
  delete: true
  summary: '{{id}} · {{title}} [{{kind}}]'
  description: Chỉ dự án có "Hiện ở hồ sơ nào" mới lên web.
  fields:
  - name: id
    label: Mã định danh (id)
    widget: string
    hint: Chữ thường không dấu, số, dấu gạch ngang. Trùng tên file. Đặt xong thì ĐỪNG đổi.
    required: true
    pattern:
    - ^[a-z0-9]+(-[a-z0-9]+)*$
    - 'Chỉ gồm chữ thường không dấu, số, dấu gạch ngang (ví dụ: python-co-ban)'
  - name: visible
    label: Hiện ở hồ sơ nào
    widget: select
    hint: Chọn một hoặc cả hai. ĐỂ TRỐNG = ẨN HOÀN TOÀN khỏi web.
    required: false
    options:
    - label: Hồ sơ học thuật (tiếng Anh)
      value: academic
    - label: Hồ sơ đi làm (tiếng Việt)
      value: job
    multiple: true
  - name: order
    label: Thứ tự
    widget: number
    hint: Số nhỏ hiện trước.
    required: true
    value_type: int
  - name: featured
    label: Dự án nổi bật (trang chủ)
    widget: boolean
    required: false
    default: false
  - name: kind
    label: Loại dự án
    widget: select
    required: true
    options:
    - label: Hệ thống / sản phẩm
      value: system
    - label: Một nghiên cứu
      value: research
    - label: Dự án thực hành (luôn gắn nhãn)
      value: practice
  - name: stage
    label: Giai đoạn (trang Research)
    widget: number
    hint: Số thứ tự giai đoạn trên trang Research. Bỏ trống nếu không áp dụng.
    required: false
    value_type: int
  - name: status
    label: Tình trạng
    widget: select
    required: true
    options:
    - label: Đang làm
      value: ongoing
    - label: Hoàn thành
      value: completed
    - label: Đã nộp
      value: submitted
    - label: Đang chuẩn bị
      value: in_preparation
    - label: Lưu trữ
      value: archived
  - name: title
    label: Tên dự án
    widget: string
    hint: Tên gốc, không dịch.
    required: true
  - name: status_note_en
    label: Chữ trạng thái (bên phải tên dự án) (tiếng Anh)
    widget: string
    hint: 'Tùy chọn. Chỉ hiện khi dự án không có ngày bắt đầu. Ví dụ: in progress.'
    required: false
  - name: status_note_vi
    label: Chữ trạng thái (bên phải tên dự án) (tiếng Việt)
    widget: string
    hint: 'Tùy chọn. Chỉ hiện khi dự án không có ngày bắt đầu. Ví dụ: đang hoàn thiện.'
    required: false
  - name: tags
    label: Thẻ nhỏ
    widget: list
    hint: 'Ví dụ: "Phát triển cùng Claude/Codex", "Bài báo: EAI AICON 2026 (đang phản biện)". Thẻ chỉ hiện ở hồ sơ có chữ tương ứng.'
    required: false
    fields:
    - name: label_en
      label: Chữ thẻ (tiếng Anh)
      widget: string
      required: false
    - name: label_vi
      label: Chữ thẻ (tiếng Việt)
      widget: string
      required: false
    - name: url
      label: Liên kết (tùy chọn)
      widget: string
      hint: 'https://... hoặc #pub-<id bài báo> để nhảy tới bài báo trong trang.'
      required: false
    label_singular: thẻ
    summary: '{{label_vi}}{{label_en}}'
  - name: tagline_en
    label: Mô tả một dòng (tiếng Anh)
    widget: string
    hint: Hiện ở hồ sơ học thuật. Bắt buộc nếu mục hiện ở hồ sơ học thuật.
    required: false
  - name: tagline_vi
    label: Mô tả một dòng (tiếng Việt)
    widget: string
    hint: Hiện ở hồ sơ đi làm. Bắt buộc nếu mục hiện ở hồ sơ đi làm.
    required: false
  - name: summary_en
    label: Mô tả (đoạn) (tiếng Anh)
    widget: text
    hint: Hiện ở hồ sơ học thuật. Bắt buộc nếu mục hiện ở hồ sơ học thuật.
    required: false
  - name: summary_vi
    label: Mô tả (đoạn) (tiếng Việt)
    widget: text
    hint: Hiện ở hồ sơ đi làm. Bắt buộc nếu mục hiện ở hồ sơ đi làm.
    required: false
  - name: contribution_en
    label: Vai trò của bạn (tiếng Anh)
    widget: text
    hint: 'Chỉ dùng: "Designed, directed and validated (AI-assisted)". Không viết "wrote code".'
    required: false
  - name: contribution_vi
    label: Vai trò của bạn (tiếng Việt)
    widget: text
    hint: 'Chỉ dùng: "Thiết kế, điều phối công cụ AI, kiểm định". Không viết "tự code".'
    required: false
  - name: highlights_en
    label: Điểm nhấn (tiếng Anh)
    widget: list
    hint: Mỗi dòng một gạch đầu dòng.
    required: false
  - name: highlights_vi
    label: Điểm nhấn (tiếng Việt)
    widget: list
    hint: Mỗi dòng một gạch đầu dòng.
    required: false
  - name: tech
    label: Công nghệ
    widget: list
    hint: Mỗi dòng một công nghệ. Không dịch.
    required: false
  - name: start
    label: Bắt đầu
    widget: string
    hint: Viết 2025 hoặc 2025-11
    required: false
    pattern:
    - ^\d{4}(-\d{2})?$
    - Viết 2025 hoặc 2025-11
  - name: end
    label: Kết thúc
    widget: string
    hint: Viết 2025 hoặc 2025-11. Bỏ trống = chưa kết thúc.
    required: false
    pattern:
    - ^\d{4}(-\d{2})?$
    - Viết 2025 hoặc 2025-11
  - name: advisor
    label: Người hướng dẫn
    widget: string
    required: false
  - name: links
    label: Liên kết
    widget: list
    hint: Thêm từng liên kết (GitHub, bài báo, demo...).
    required: false
    fields:
    - name: label_en
      label: Tên liên kết (tiếng Anh)
      widget: string
      required: false
    - name: label_vi
      label: Tên liên kết (tiếng Việt)
      widget: string
      required: false
    - name: url
      label: Địa chỉ (URL)
      widget: string
      hint: Bắt đầu bằng https://
      required: true
      type: url
    label_singular: liên kết
    summary: '{{label_vi}}{{label_en}} {{url}}'
  - name: figures
    label: Hình ảnh / sơ đồ
    widget: list
    required: false
    fields:
    - name: src
      label: Ảnh
      widget: image
      required: true
    - name: alt_en
      label: Mô tả ảnh (tiếng Anh, cho người khiếm thị)
      widget: string
      required: true
    - name: caption_en
      label: Chú thích (tiếng Anh)
      widget: string
      required: false
    - name: caption_vi
      label: Chú thích (tiếng Việt)
      widget: string
      required: false
